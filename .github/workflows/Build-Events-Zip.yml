name: Update Events Data

on:
  push:
    paths:
      - 'Events/**'
      - 'Events'
    branches:
      - Main

jobs:
  zip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install zip
        run: sudo apt-get install zip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate runtime schema
        run: python scripts/validate_events.py Events

      - name: Check templates for captured identifiers
        run: python scripts/validate_template_privacy.py Events

      - name: Render every achievement offline
        run: dotnet run --project Tests/EventPayloadRenderer.Tests -- Events

      - name: Zip Events folder
        run: zip -r Events.zip Events

      - name: Create meta.json
        run: |
            echo '{
              "Timestamp": '$(date +%s)',
              "DataVersion": "1.0"
            }' > meta.json

      - name: Setup Git
        run: |
            git config --global user.email "38233332+ItsLogic@users.noreply.github.com"
            git config --global user.name "Events Data Action"

      - name: Create and switch to new branch
        run: |
            git checkout --orphan Events-Data
            git rm --cached -r .

      - name: Add files to new branch
        run: |
            git add Events.zip meta.json
            git commit -m "Update events data: $(date -u +'%Y-%m-%d %H:%M:%S')"

      - name: Force Push to new branch
        run: git push --force origin Events-Data
